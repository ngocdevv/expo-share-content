<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Photos">
  <defs>
    <linearGradient id="photosBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f4f6"/>
    </linearGradient>
    <radialGradient id="petalShine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="26.5" fill="url(#photosBg)"/>
  <g transform="translate(60 61)">
    <!-- Overlapping translucent petals like iOS Photos -->
    <g opacity="0.96">
      <ellipse cx="0" cy="-21" rx="12.5" ry="20" fill="#FF2D55" transform="rotate(0)" opacity="0.92"/>
      <ellipse cx="0" cy="-21" rx="12.5" ry="20" fill="#FF9500" transform="rotate(45)" opacity="0.92"/>
      <ellipse cx="0" cy="-21" rx="12.5" ry="20" fill="#FFCC00" transform="rotate(90)" opacity="0.92"/>
      <ellipse cx="0" cy="-21" rx="12.5" ry="20" fill="#34C759" transform="rotate(135)" opacity="0.92"/>
      <ellipse cx="0" cy="-21" rx="12.5" ry="20" fill="#5AC8FA" transform="rotate(180)" opacity="0.92"/>
      <ellipse cx="0" cy="-21" rx="12.5" ry="20" fill="#007AFF" transform="rotate(225)" opacity="0.92"/>
      <ellipse cx="0" cy="-21" rx="12.5" ry="20" fill="#5856D6" transform="rotate(270)" opacity="0.92"/>
      <ellipse cx="0" cy="-21" rx="12.5" ry="20" fill="#AF52DE" transform="rotate(315)" opacity="0.92"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="9" fill="url(#petalShine)"/>
  </g>
</svg>
